[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "psa-alert-system"
version = "2.0.0"
description = "Multi-agent RAG system for PSA port operations incident triage and escalation"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["rag", "langgraph", "multi-agent", "incident-management", "port-operations"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
