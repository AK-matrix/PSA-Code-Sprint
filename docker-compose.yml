version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      - PORT=5000
    volumes:
      # Persist the vector store and SQLite DB across container restarts
      - ./chroma_db:/app/chroma_db
      - ./psa_incidents.db:/app/psa_incidents.db
      # Mount log files (read-only) so they're available inside the container
      - ./Application Logs:/app/Application Logs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: psa-network
